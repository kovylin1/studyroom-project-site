name: Staggered scrape (per-aggregator)

# Один агрегатор каждые ~3 дня. Каждый обновляется ровно 1 раз в месяц.
# Система не перегружается — 1 076 карточек не парсятся все разом.
#
# Маппинг «день месяца → агрегатор» — единый источник: scraper/sources/aggregator-schedules.json
# (поле dayOfMonth). Шаг detect читает его, отдельной bash-таблицы больше нет.
# ВАЖНО: список дней в cron ниже статичен (YAML не читает JSON) — держать синхронным
# с dayOfMonth в JSON вручную. Сейчас: 1,3,6,9,12,15,18,21,24,27,30.
#
# ДВА ПОКОЛЕНИЯ КОЛЛЕКТОРОВ (разбор — HANDOFF-2026-09-11.md).
#   kompas-collect-*.mjs — поколение КОМПАСа (июль–август 2026): перечисляет состав
#     агрегатора живьём, меряет себя («заявлено источником / собрано» в
#     sources/kompas/membership/<агрегатор>.json), пишет выгрузки в песочницу
#     sources/kompas/extracts/<агрегатор>/. В ЖИВОЙ КАТАЛОГ НЕ ПИШЕТ.
#   scrape-*-all.mjs, seed-*.mjs — поколение мая: пишет в scraper/sources/<x>-extracts/,
#     оттуда merge-programs.mjs вливает в живой каталог.
# До 11.09.2026 здесь вызывалось только майское поколение, и половина вызовов
# была мертва: Edvoy падал на переверстанном логине, IAPro — на кнопке входа,
# Study Group не запускался без SG_*, а вместо коллектора QS звалась разведка
# discover-qs-partners.mjs, которой не давали секретов. Все вызовы шли через
# `|| true`, поэтому прогон оставался зелёным, а lastRunAt обновлялся и при нуле.

on:
  schedule:
    - cron: '0 3 1,3,6,9,12,15,18,21,24,27,30 * *'
  workflow_dispatch:
    inputs:
      aggregator:
        description: 'Агрегатор (пусто = определить по дню месяца)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kaplan-pathways
          - navitas-pathways
          - qahe
          - studygroup
          - cats
          - oxford-international
          - edvoy
          - iapro
          - qs-topuniversities
          - gedu
          - volk

permissions:
  contents: write

concurrency:
  group: staggered
  cancel-in-progress: false

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Определить агрегатор по дню месяца
        id: detect
        run: |
          AGG="${{ github.event.inputs.aggregator }}"
          if [ -z "$AGG" ]; then
            DOM=$(date -u +%-d)
            # Единый источник дня прогона — dayOfMonth в aggregator-schedules.json.
            AGG=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('scraper/sources/aggregator-schedules.json','utf8'));const dom=Number(process.argv[1]);const hit=Object.entries(d).find(([,v])=>v&&v.dayOfMonth===dom);process.stdout.write(hit?hit[0]:'');" "$DOM")
            if [ -z "$AGG" ]; then
              echo "Нет агрегатора для дня $DOM — пропуск"
              echo "aggregator=" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "aggregator=$AGG" >> $GITHUB_OUTPUT
          echo "Агрегатор: $AGG"

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.aggregator != ''
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        if: steps.detect.outputs.aggregator != ''
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: Install Playwright (порталы под логином + сайты за Cloudflare)
        # Edvoy больше не требует браузера: kompas-collect-edvoy ходит в GraphQL
        # анонимно. Остались два портала с настоящим входом — IAPro (Salesforce Aura)
        # и QS Apply (Appian SAIL), плюс GEDU: сайты брендов холдинга закрыты
        # Cloudflare и JS-рендером, без браузера обход отдаёт втрое меньше программ
        # (englishpath 13→3, GBS 14→2) — а браузер для него тут не ставили ни разу.
        if: |
          steps.detect.outputs.aggregator == 'iapro' ||
          steps.detect.outputs.aggregator == 'qs-topuniversities' ||
          steps.detect.outputs.aggregator == 'gedu'
        run: cd scraper && npx playwright install chromium --with-deps

      - name: Обновить каталог агрегатором
        if: steps.detect.outputs.aggregator != ''
        env:
          IAPRO_LOGIN:    ${{ secrets.IAPRO_LOGIN }}
          IAPRO_PASS:     ${{ secrets.IAPRO_PASS }}
          IAPRO_PASS_ALT: ${{ secrets.IAPRO_PASS_ALT }}
          QS_LOGIN:       ${{ secrets.QS_LOGIN }}
          QS_PASS:        ${{ secrets.QS_PASS }}
        # Одна команда на агрегатор: сбор -> рабочая копия -> цены и программы
        # этого агрегатора -> порог изменения -> перенос в живой каталог -> гейт.
        # Разбор шагов и причин порядка — в шапке scraper/kompas-update.mjs.
        # Прогон падает, если коллектор вернул ошибку, изменение вышло за порог
        # или гейт каталога покраснел: тогда lastRunAt ниже НЕ обновляется и
        # деплой не идёт. Отчёт прогона ложится в site/public/api/update-runs.json
        # и оттуда его читает панель менеджера.
        run: node scraper/kompas-update.mjs --agg=${{ steps.detect.outputs.aggregator }} --apply

      - name: Сверка и панель КОМПАСа
        if: steps.detect.outputs.aggregator != ''
        run: |
          KOMPAS_WORK_DIR=site/src/content/universities node scraper/kompas-diff.mjs || true
          node scraper/kompas-panel.mjs || true

      - name: Auto-revizor (только свежеспарсенные)
        if: steps.detect.outputs.aggregator != ''
        run: |
          node scraper/revizor.mjs --aggregator=${{ steps.detect.outputs.aggregator }} || true

      - name: Обновить lastRunAt в aggregator-schedules.json
        # Шаг выполняется только если коллектор отработал без ошибки: `|| true` снят,
        # а шаги по умолчанию не запускаются после падения предыдущего.
        if: steps.detect.outputs.aggregator != ''
        run: |
          AGG="${{ steps.detect.outputs.aggregator }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e "
            const fs = require('fs');
            const p = 'scraper/sources/aggregator-schedules.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (d['${AGG}']) d['${AGG}'].lastRunAt = '${NOW}';
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
            console.log('lastRunAt обновлён для', '${AGG}');
          "

      - name: Build site
        if: steps.detect.outputs.aggregator != ''
        run: cd site && npm run build

      - name: Commit + push
        if: steps.detect.outputs.aggregator != ''
        run: |
          AGG="${{ steps.detect.outputs.aggregator }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ scraper/sources/ site/public/api/ sources/kompas/
          git diff --staged --quiet || git commit -m "chore: staggered — ${AGG} $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: Deploy
        if: steps.detect.outputs.aggregator != ''
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
