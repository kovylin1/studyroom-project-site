name: Staggered scrape (per-aggregator)

# Один агрегатор каждые ~3 дня. Каждый обновляется ровно 1 раз в месяц.
# Система не перегружается — 804 университета не парсятся все разом.
#
# Маппинг «день месяца → агрегатор» — единый источник: scraper/sources/aggregator-schedules.json
# (поле dayOfMonth). Шаг detect читает его, отдельной bash-таблицы больше нет.
# ВАЖНО: список дней в cron ниже статичен (YAML не читает JSON) — держать синхронным
# с dayOfMonth в JSON вручную. Сейчас: 1,3,6,9,12,15,18,21,24,27,30.

on:
  schedule:
    - cron: '0 3 1,3,6,9,12,15,18,21,24,27,30 * *'
  workflow_dispatch:
    inputs:
      aggregator:
        description: 'Агрегатор (пусто = определить по дню месяца)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kaplan-pathways
          - navitas-pathways
          - qahe
          - studygroup
          - cats
          - oxford-international
          - edvoy
          - iapro
          - qs-topuniversities
          - gedu
          - volk

permissions:
  contents: write

concurrency:
  group: staggered
  cancel-in-progress: false

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Определить агрегатор по дню месяца
        id: detect
        run: |
          AGG="${{ github.event.inputs.aggregator }}"
          if [ -z "$AGG" ]; then
            DOM=$(date -u +%-d)
            # Единый источник дня прогона — dayOfMonth в aggregator-schedules.json.
            # (Раньше тут дублировалась bash-таблица; теперь читаем JSON через предустановленный node.)
            AGG=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('scraper/sources/aggregator-schedules.json','utf8'));const dom=Number(process.argv[1]);const hit=Object.entries(d).find(([,v])=>v&&v.dayOfMonth===dom);process.stdout.write(hit?hit[0]:'');" "$DOM")
            if [ -z "$AGG" ]; then
              echo "Нет агрегатора для дня $DOM — пропуск"
              echo "aggregator=" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "aggregator=$AGG" >> $GITHUB_OUTPUT
          echo "Агрегатор: $AGG"

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.aggregator != ''
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        if: steps.detect.outputs.aggregator != ''
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: Install Playwright (только для Edvoy и IAPro)
        if: |
          steps.detect.outputs.aggregator == 'edvoy' ||
          steps.detect.outputs.aggregator == 'iapro'
        run: cd scraper && npx playwright install chromium --with-deps

      - name: Запустить коллектор
        if: steps.detect.outputs.aggregator != ''
        env:
          EDVOY_LOGIN: ${{ secrets.EDVOY_LOGIN }}
          EDVOY_PASS:  ${{ secrets.EDVOY_PASS }}
          IAPRO_LOGIN: ${{ secrets.IAPRO_LOGIN }}
          IAPRO_PASS:  ${{ secrets.IAPRO_PASS }}
        run: |
          AGG="${{ steps.detect.outputs.aggregator }}"
          echo "=== Коллектор: $AGG ==="
          case $AGG in
            kaplan-pathways)
              node scraper/scrape-direct-partners-v2.mjs || true
              ;;
            navitas-pathways)
              for region in uk au ca nz us de nl; do
                node scraper/seed-navitas-${region}.mjs || true
              done
              ;;
            qahe)
              node scraper/scrape-qahe-all.mjs || true
              ;;
            studygroup)
              node scraper/scrape-studygroup-all.mjs || true
              ;;
            cats)
              node scraper/scrape-cats-all.mjs || true
              ;;
            oxford-international)
              node scraper/seed-oxfordintl-uk.mjs || true
              ;;
            edvoy)
              node scraper/scrape-edvoy-all.mjs || true
              ;;
            iapro)
              node scraper/scrape-iapro-all.mjs || true
              ;;
            qs-topuniversities)
              node scraper/discover-qs-partners.mjs || true
              ;;
            gedu)
              node scraper/scrape-gedu-all.mjs || true
              ;;
            volk)
              node scraper/scrape-volk-collab-v3.mjs || true
              ;;
          esac

      - name: Merge + detect-gaps
        if: steps.detect.outputs.aggregator != ''
        run: |
          node scraper/detect-gaps.mjs    || true
          node scraper/merge-programs.mjs

      - name: Auto-revizor (только свежеспарсенные)
        if: steps.detect.outputs.aggregator != ''
        run: |
          node scraper/revizor.mjs --aggregator=${{ steps.detect.outputs.aggregator }} || true

      - name: Обновить lastRunAt в aggregator-schedules.json
        if: steps.detect.outputs.aggregator != ''
        run: |
          AGG="${{ steps.detect.outputs.aggregator }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e "
            const fs = require('fs');
            const p = 'scraper/sources/aggregator-schedules.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (d['${AGG}']) d['${AGG}'].lastRunAt = '${NOW}';
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
            console.log('lastRunAt обновлён для', '${AGG}');
          "

      - name: Build site
        if: steps.detect.outputs.aggregator != ''
        run: cd site && npm run build

      - name: Commit + push
        if: steps.detect.outputs.aggregator != ''
        run: |
          AGG="${{ steps.detect.outputs.aggregator }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ scraper/sources/ site/public/api/
          git diff --staged --quiet || git commit -m "chore: staggered — ${AGG} $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: Deploy
        if: steps.detect.outputs.aggregator != ''
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
