name: ОРЁЛ — обновить фото (on-demand)

on:
  workflow_dispatch:   # только ручной запуск

permissions:
  contents: write

concurrency:
  group: orel
  cancel-in-progress: true

jobs:
  orel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: ОРЁЛ — discover + download + quality filter
        run: node scraper/orel.mjs

      - name: Build site
        run: cd site && npm run build

      - name: Commit photo updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ site/public/photos/ site/public/api/
          git diff --staged --quiet || git commit -m "chore: photo update $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: Deploy to Cloudflare Pages
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
