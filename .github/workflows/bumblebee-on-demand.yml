name: БАМБЛБИ — автофикс критических проблем (on-demand)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (только репорт, без исправлений)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      only_critical:
        description: 'Только CRITICAL (programs=0), пропустить HIGH/MEDIUM'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      limit:
        description: 'Максимум unis за прогон'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: bumblebee
  cancel-in-progress: true

jobs:
  bumblebee:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps + Playwright
        run: cd scraper && npm ci && npx playwright install chromium --with-deps

      - name: Install site deps
        run: cd site && npm ci

      - name: БАМБЛБИ — диагностика + автофикс
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.only_critical }}" = "true" ] && ARGS="$ARGS --only-critical"
          ARGS="$ARGS --limit ${{ inputs.limit || 20 }}"
          node scraper/bumblebee.mjs $ARGS
        continue-on-error: true

      - name: Build site
        run: cd site && npm run build

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ scraper/sources/bumblebee-report.json site/public/api/
          git diff --staged --quiet || git commit -m "chore: БАМБЛБИ autofix $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: Deploy
        run: cd site && npx wrangler pages deploy dist --project-name=studyroom-project-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
