name: Monthly consolidation rebuild

# Запускается 1-го числа каждого месяца — после того как staggered за месяц
# обновил все агрегаторы. Не скрейпит заново — только merge + rebuild + deploy.
# Используется также как ручной "пересобрать всё" из manager UI.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1-го числа в 06:00 UTC (после staggered дня 1 в 03:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: Merge programs + detect gaps
        run: |
          node scraper/detect-gaps.mjs  || true
          node scraper/merge-programs.mjs

      - name: СОРОКА — проверка цифр (cross-check, без live)
        # Полный кросс-чек цифр каталога после merge. --skip-live: детерминированно,
        # $0, без флейки-фетчей офсайтов в CI (точечный live — on-demand вручную).
        # Пишет site/public/api/soroka-review.json (кейсы → панель /manager); шаг
        # «Commit + push» ниже подхватывает его через `git add site/public/api/`.
        run: node scraper/soroka.mjs --skip-live  || true

      - name: КОМПАС — замер дрейфа каталог vs партнёрские источники
        # Сверка ЖИВОГО каталога с назначенными источниками (partner-source-map):
        # сколько программ подтверждено, расхождения цен, недобор. Детерминированно,
        # $0, без сети — сравнивает с уже собранными выгрузками. Кейсы уходят в
        # sources/kompas/diff-review.json, панель пересводится kompas-panel.
        run: |
          KOMPAS_WORK_DIR=site/src/content/universities node scraper/kompas-diff.mjs  || true
          node scraper/kompas-panel.mjs  || true

      - name: Generate status + verify snapshots
        run: |
          node site/scripts/generate-status.mjs  || true
          node site/scripts/generate-verify.mjs  || true

      - name: Build site
        run: cd site && npm run build

      - name: Commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/sources/ site/public/api/ sources/kompas/diff-review.json sources/kompas/diff-report.json
          git diff --staged --quiet || git commit -m "chore: monthly consolidation $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: Deploy to Cloudflare Pages
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
