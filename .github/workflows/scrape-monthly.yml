name: Monthly university data refresh

# Runs on the 1st of each month at 03:00 UTC. Scrapes every university in
# sources/universities.list.md (UK + CA + US + AU + NZ), builds the Astro
# site, commits the JSON deltas directly to `main`, and deploys to
# Cloudflare Pages.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN — Cloudflare API token with "Account: Cloudflare
#     Pages — Edit" permission. Create at
#     https://dash.cloudflare.com/profile/api-tokens.
#   - CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID (visible on any
#     dashboard page under the right-hand sidebar).
#
# Without these, the deploy step is skipped — the data still commits to
# `main` and Cloudflare's GitHub-auto-deploy (once configured per
# DEPLOYMENT.md) will pick it up.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      - name: Run scraper for all registered universities
        working-directory: scraper
        run: npm run scrape -- --all

      - name: Install site deps + build (validates Zod schemas)
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Commit data updates to main
        id: commit
        run: |
          git config user.name "studyroom-bot"
          git config user.email "studyroom-bot@users.noreply.github.com"
          git add site/src/content/universities/*.json site/public/api/status.json
          if git diff --staged --quiet; then
            echo "No data changes this run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): monthly scrape refresh (run ${{ github.run_id }})"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # Skip the deploy when no data changed OR when Cloudflare secrets
        # aren't configured. Without secrets, repo owners who've connected
        # Cloudflare Pages to GitHub via the dashboard still get auto-deploy
        # on the push above.
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
