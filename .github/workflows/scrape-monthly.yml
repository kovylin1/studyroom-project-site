name: Scrape & Deploy (monthly)

on:
  schedule:
    - cron: '0 3 1 * *'   # 1-го числа каждого месяца в 03:00 UTC
  workflow_dispatch:        # ручной запуск из manager UI или GitHub

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install scraper deps + Playwright
        run: cd scraper && npm ci && npx playwright install chromium --with-deps

      - name: Install site deps
        run: cd site && npm ci

      # ── Phase 1: ПАУК (programs) ──────────────────────────────────────
      - name: ПАУК — QAHE collector
        run: node scraper/scrape-qahe-all.mjs
        continue-on-error: true

      - name: ПАУК — Edvoy (Playwright)
        run: node scraper/scrape-edvoy-all.mjs
        env:
          EDVOY_LOGIN: ${{ secrets.EDVOY_LOGIN }}
          EDVOY_PASS: ${{ secrets.EDVOY_PASS }}
        continue-on-error: true

      - name: ПАУК — iapro (Playwright)
        run: node scraper/scrape-iapro-all.mjs
        env:
          IAPRO_LOGIN: ${{ secrets.IAPRO_LOGIN }}
          IAPRO_PASS: ${{ secrets.IAPRO_PASS }}
        continue-on-error: true

      - name: ПАУК — detect-gaps + merge
        run: |
          node scraper/detect-gaps.mjs
          node scraper/merge-programs.mjs

      # ── Phase 2: БОБР (campuses + accommodation) ──────────────────────
      - name: БОБР — campuses + accommodation
        run: node scraper/bobr.mjs --skip-photos --skip-verifier
        continue-on-error: true

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build site
        run: cd site && npm run build

      # ── Commit catalog + status.json back to repo ─────────────────────
      - name: Commit catalog updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ scraper/sources/ site/public/api/
          git diff --staged --quiet || git commit -m "chore: monthly catalog update $(date -u +%Y-%m-%d)"
          git push

      # ── Deploy to Cloudflare Pages ─────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
