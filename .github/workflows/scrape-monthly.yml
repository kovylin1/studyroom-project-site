name: Monthly consolidation rebuild

# Запускается 1-го числа каждого месяца — после того как staggered за месяц
# обновил все агрегаторы. Не скрейпит заново — только merge + rebuild + deploy.
# Используется также как ручной "пересобрать всё" из manager UI.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1-го числа в 06:00 UTC (после staggered дня 1 в 03:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: Merge programs + detect gaps
        run: |
          node scraper/detect-gaps.mjs  || true
          node scraper/merge-programs.mjs

      - name: Generate status + verify snapshots
        run: |
          node site/scripts/generate-status.mjs  || true
          node site/scripts/generate-verify.mjs  || true

      - name: Build site
        run: cd site && npm run build

      - name: Commit + push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/sources/ site/public/api/
          git diff --staged --quiet || git commit -m "chore: monthly consolidation $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy to Cloudflare Pages
        run: |
          cd site && npx wrangler pages deploy dist \
            --project-name=studyroom-project-site \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
