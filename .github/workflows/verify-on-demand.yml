name: Verify link freshness (on-demand)

on:
  workflow_dispatch:   # запускается кнопкой "Проверить актуальность" в manager UI

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci

      # Обновляем worklist
      - name: detect-gaps
        run: node scraper/detect-gaps.mjs

      # ШМЕЛЬ — топ-50 unis с gap-проблемами
      - name: shmel (limit 50)
        run: node scraper/shmel.mjs --limit=50 --concurrency=6

      # Revizor — link liveness (3 программы на университет)
      - name: revizor
        run: node scraper/revizor.mjs
        continue-on-error: true

      # Генерируем verify.json для manager UI
      - name: generate verify.json
        run: node site/scripts/generate-verify.mjs

      # Build чтобы обновить status.json
      - name: build site
        run: cd site && npm run build

      - name: commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/api/ scraper/sources/
          git diff --staged --quiet || git commit -m "chore: verify $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
