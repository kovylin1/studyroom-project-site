name: Verify link freshness (on-demand)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope'
        required: false
        default: 'critical'
        type: choice
        options: ['critical', 'all']

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json

      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci

      - name: detect-gaps
        run: node scraper/detect-gaps.mjs

      - name: shmel
        # enrichment is optional for the verify report — don't kill the run
        continue-on-error: true
        run: |
          if [ "${{ inputs.scope }}" = "all" ]; then
            node scraper/shmel.mjs --concurrency=6
          else
            node scraper/shmel.mjs --limit=50 --concurrency=6
          fi

      - name: revizor
        run: |
          if [ "${{ inputs.scope }}" = "all" ]; then
            node scraper/revizor.mjs
          else
            node scraper/revizor.mjs --limit=100
          fi
        continue-on-error: true

      - name: generate verify.json
        id: verify
        # soft here so partial revizor/shmel results still get committed; gated below
        continue-on-error: true
        run: node site/scripts/generate-verify.mjs

      - name: build site
        run: cd site && npm run build

      - name: commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/api/ scraper/sources/
          git diff --staged --quiet || git commit -m "chore: verify $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done

      - name: fail if verify.json generation failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::generate-verify.mjs failed — verify.json is stale (partial results committed above)"
          exit 1
