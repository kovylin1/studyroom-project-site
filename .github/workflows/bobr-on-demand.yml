name: БОБР — обновить кампусы (on-demand)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bobr
  cancel-in-progress: true
jobs:
  bobr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            scraper/package-lock.json
            site/package-lock.json
      - name: Install deps
        run: cd scraper && npm ci && cd ../site && npm ci
      - name: БОБР — campuses + accommodation
        run: node scraper/bobr.mjs --skip-photos
        continue-on-error: true
      - name: Build site
        run: cd site && npm run build
      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/universities/ site/public/api/
          git diff --staged --quiet || git commit -m "chore: БОБР update $(date -u +%Y-%m-%d)"
          attempt=0
          until git push; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "::error::git push failed after 3 retries"; exit 1; fi
            git pull --rebase origin main
          done
      - name: Deploy
        run: cd site && npx wrangler pages deploy dist --project-name=studyroom-project-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
